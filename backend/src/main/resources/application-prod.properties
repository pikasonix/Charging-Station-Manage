spring.application.name=charging_station_management

# Server will use PORT from environment (Render provides this)
server.port=${PORT:8080}

# ===============================
# Datasource (PostgreSQL - Render)
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=5

# ===============================
# JPA Configuration
# ===============================
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ===============================
# JWT Configuration
# ===============================
app.jwtSecret=${JWT_SECRET}
app.jwtExpirationMs=86400000

# ===============================
# Upload Directory
# ===============================
application.upload-dir=/app/uploads

# ===============================
# Mail Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.debug=false

# ===============================
# CORS & Frontend
# ===============================
app.frontend.url=${FRONTEND_URL}
app.cors.allowed-origins=${FRONTEND_URL},https://your-frontend-domain.onrender.com

# ===============================
# Internationalization
# ===============================
spring.messages.basename=i18n/auth, i18n/validation, i18n/common
spring.messages.encoding=UTF-8

# ===============================
# Jackson Configuration
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# ===============================
# Error Handling
# ===============================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# ===============================
# Production Settings
# ===============================
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# Disable banner for cleaner logs
spring.main.banner-mode=off
