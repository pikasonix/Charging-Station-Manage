services:
  # PostgreSQL Database
  - type: postgres
    name: charging-postgres
    plan: free
    region: singapore
    databaseName: charging_station_db
    user: postgres

  # Spring Boot Backend
  - type: web
    name: charging-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: charging-postgres
          property: connectionString
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:3000
    healthCheckPath: /actuator/health
