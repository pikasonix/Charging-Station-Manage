services:
  # PostgreSQL Database
  - type: pserv
    name: charging-postgres
    env: docker
    plan: free
    region: singapore
    envVars:
      - key: POSTGRES_USER
        value: postgres
      - key: POSTGRES_PASSWORD
        generateValue: true
      - key: POSTGRES_DB
        value: charging_station_db

  # Spring Boot Backend
  - type: web
    name: charging-backend
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: charging-postgres
          property: connectionString
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: http://localhost:3000
    healthCheckPath: /actuator/health
