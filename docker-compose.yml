version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: charging_postgres
    restart: always
    environment:
      POSTGRES_DB: charging_station_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - charging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: charging_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
    volumes:
      - uploads:/app/uploads
    networks:
      - charging-network

  # Frontend chạy local, không deploy trong Docker
  # Để chạy frontend: cd frontend && npm run dev

volumes:
  postgres_data:
  uploads:

networks:
  charging-network:
    driver: bridge
