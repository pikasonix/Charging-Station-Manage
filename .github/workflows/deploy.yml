name: Deploy to Render

on:
  push:
    branches: [ "release" ] # Chạy khi push vào branch release
    paths:
      - 'backend/**'      # CHỈ chạy khi có thay đổi trong thư mục backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests --file backend/pom.xml

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile.render
          push: true
          # Sửa lỗi: Viết liền mạch trên một dòng hoặc dùng dấu | nếu muốn xuống dòng
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/charging-backend:latest

      - name: Trigger Render Deploy
        # Thêm nháy kép bao quanh URL để tránh lỗi ký tự đặc biệt trong token
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"